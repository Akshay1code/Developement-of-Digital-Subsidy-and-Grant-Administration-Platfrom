version: '3.8'

services:
  # ── Spring Boot Backend ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gov_scheme_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - SUPABASE_DB_USERNAME=${SUPABASE_DB_USERNAME}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      # Replace this in your real Render environment!
      - JWT_SECRET=YOUR_SUPER_SECRET_JWT_KEY_FOR_PRODUCTION_MUST_BE_LONG_ENOUGH
      - ALLOWED_ORIGINS=*
      # Cloudinary fallback to demo if not provided
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-demo}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-demo}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-demo}
    restart: unless-stopped

